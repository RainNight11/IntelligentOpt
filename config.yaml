  num_subpops: 4              # 子种群数量 [建议: 2-8, 需整除population_size]
  migration_period: 10        # 迁移周期（代数）[建议: 5-20]
  improvement_window: 10      # 改进判断窗口大小 [建议: 5-20]
  migration_count: 3          # 每次迁移个体数 [建议: 1-5]
  migration_good_threshold: 0.01   # "优秀"子种群改进率阈值
