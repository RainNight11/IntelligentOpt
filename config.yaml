# ============================================================================
# 四、算法变体定义
# ============================================================================
algorithms:
  GA_baseline:
    name: "基础遗传算法"
    description: "单种群，固定算子"
    use_multipop: false
    use_rescue_migration: false
    use_rl: false
  
  GA_MP:
    name: "多种群遗传算法"
    description: "多种群并行进化，含救援迁移策略"
    use_multipop: true
    use_rescue_migration: true
    use_rl: false
  
  GA_RL:
    name: "RL增强遗传算法"
    description: "Q-learning自适应算子选择"
    use_multipop: false
    use_rescue_migration: false
    use_rl: true
  
  GA_MP_RL:
    name: "混合算法"
    description: "多种群 + RL自适应"
    use_multipop: true
    use_rescue_migration: true
    use_rl: true

# ============================================================================
# 五、基准测试函数
# ============================================================================
benchmarks:
  # 单峰函数（简单）
