ga:
  # 种群参数
  population_size: 400        # 种群大小 [建议: 50-500]
  dim: 40                     # 问题维度（决策变量数量）
  
  # 进化参数
  num_generations: 2000       # 最大进化代数 [建议: 100-2000]
  p_c: 0.9                    # 交叉概率 [建议: 0.6-0.95]
  p_m: 0.05                   # 变异概率 [建议: 0.01-0.1]
